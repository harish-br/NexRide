<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- App Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/logo.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />

  <!-- Mobile Safe View -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- PWA -->
  <meta name="theme-color" content="#1E40FF">
  <link rel="manifest" href="/manifest.json" />

  <!-- SEO TITLE -->
  <title>
    NexRide | Transportation & Mobility Application
  </title>

  <!-- SEO DESCRIPTION -->
  <meta name="description"
    content="NexRide is a transportation and mobility application providing bus and train service information along with cab and auto booking across selected cities in Tamil Nadu." />

  <!-- SEO KEYWORDS -->
  <meta name="keywords"
    content="NexRide, Erode bus tracking, Ooty bus timing, Coimbatore transport app, Tiruppur bus routes, Mettupalayam bus, Gobichettipalayam transport, Anthiyur bus" />

  <!-- Search Engine Control -->
  <meta name="robots" content="index, follow" />

  <!-- Local SEO -->
  <meta name="geo.region" content="IN-TN" />
  <meta name="geo.placename" content="Erode, Anthiyur, Ooty, Coimbatore, Tiruppur, Mettupalayam, Gobichettipalayam" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NexRide">
  <meta property="og:url" content="https://nexride.co.in/">
  <meta property="og:title" content="NexRide | Transportation & Mobility Application">
  <meta property="og:description"
    content="NexRide is a transportation and mobility application providing bus and train service information along with cab and auto booking across selected cities in Tamil Nadu.">
  <meta property="og:image" content="https://nexride.co.in/icon-512.png">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://nexride.co.in/">
  <meta name="twitter:title" content="NexRide | Transportation & Mobility Application">
  <meta name="twitter:description"
    content="NexRide is a transportation and mobility application providing bus and train service information along with cab and auto booking across selected cities in Tamil Nadu.">
  <meta name="twitter:image" content="https://nexride.co.in/icon-512.png">

  <link rel="canonical" href="https://nexride.co.in/" />

  <!-- STRUCTURED DATA (VERY IMPORTANT) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Nexride",
    "url": "https://nexride.co.in",
    "logo": "https://nexride.co.in/logo.png"
  }
  </script>


</head>

<body>
  <div id="root"></div>
  <div class="rotate-warning">
    <div class="rotate-content">
      <img src="/logo.png" alt="NexRide" width="80" height="80" style="margin-bottom: 20px; border-radius: 16px;">
      <h2>Portrait Mode Only</h2>
      <p>Please rotate your device back to portrait mode for the best experience.</p>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
