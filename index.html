<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- App Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/logo.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />

  <!-- Mobile Safe View -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- PWA -->
  <meta name="theme-color" content="#1E40FF">
  <link rel="manifest" href="/manifest.json" />

  <!-- SEO TITLE -->
  <title>NexRide – Bus Timings, Parcel & Bus Booking | Erode, Ooty, Anthiyur & More</title>

  <!-- SEO DESCRIPTION -->
  <meta name="description" content="Book buses and parcels online across Erode, Anthiyur, Ooty, Gobichettipalayam and Bhavani. Check live bus timings, track parcels, and book seats instantly on NexRide." />

  <!-- SEO KEYWORDS -->
  <meta name="keywords"
    content="NexRide, bus timings, train schedules, cab booking, auto booking, travel routes, mobility app" />

  <!-- Search Engine Control -->
  <meta name="robots" content="index, follow" />

  <!-- Local SEO -->
  <meta name="geo.region" content="IN-TN" />
  <meta name="geo.placename" content="Tamil Nadu, India" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NexRide">
  <meta property="og:url" content="https://nexride.co.in/">
  <meta property="og:title" content="NexRide – Bus Timings, Parcel & Bus Booking | Erode, Ooty, Anthiyur & More">
  <meta property="og:description"
    content="Book buses and parcels online across Erode, Anthiyur, Ooty, Gobichettipalayam and Bhavani. Check live bus timings, track parcels, and book seats instantly on NexRide.">
  <meta property="og:image" content="https://nexride.co.in/icon-512.png">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://nexride.co.in/">
  <meta name="twitter:title" content="NexRide – Bus Timings, Parcel & Bus Booking | Erode, Ooty, Anthiyur & More">
  <meta name="twitter:description"
    content="Book buses and parcels online across Erode, Anthiyur, Ooty, Gobichettipalayam and Bhavani. Check live bus timings, track parcels, and book seats instantly on NexRide.">
  <meta name="twitter:image" content="https://nexride.co.in/icon-512.png">

  <link rel="canonical" href="https://nexride.co.in/" />

  <!-- STRUCTURED DATA (VERY IMPORTANT) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Nexride",
    "url": "https://nexride.co.in",
    "logo": "https://nexride.co.in/logo.png"
  }
  </script>

  <!-- MOBILE APP SCHEMA -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MobileApplication",
    "name": "NexRide – Bus Booking & Parcel",
    "applicationCategory": "TravelApplication",
    "description": "Book buses and parcels across Erode, Tiruppur, Ooty, Anthiyur, Gobichettipalayam and Bhavani. Check live bus timings instantly.",
    "areaServed": [
      "Erode", "Ooty", "Anthiyur", 
      "Gobichettipalayam", "Bhavani"
    ],
    "provider": {
      "@type": "Organization",
      "name": "NexRide",
      "url": "https://nexride.co.in"
    }
  }
  </script>

  <!-- WEBSITE SCHEMA (AI OVERVIEW FIX) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "NexRide",
    "url": "https://nexride.co.in",
    "description": "NexRide is a Tamil Nadu bus booking and parcel booking platform serving passengers across Erode, Ooty, Anthiyur, Gobichettipalayam and Bhavani.",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://nexride.co.in/search?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>


  <!-- Cashfree SDK -->
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
</head>

<body>
  <div id="root"></div>
  <div class="rotate-warning">
    <div class="rotate-content">
      <img src="/logo.png" alt="NexRide" width="80" height="80" style="margin-bottom: 20px; border-radius: 16px;">
      <h2>Portrait Mode Only</h2>
      <p>Please rotate your device back to portrait mode for the best experience.</p>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
